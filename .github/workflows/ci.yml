name: PlayMatch CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Lint, Build, Drift Check & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript Typecheck & Build
        run: npm run build

      - name: OpenAPI Drift Check
        run: npm run openapi:check

      - name: Run Vitest Suite (with coverage)
        run: npm test

  gitleaks-audit:
    name: Secret & Credential Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

env:
      MONGODB_URI: "mongodb://localhost:27017/test_db"
      CLIENT_WEB_URL: "http://localhost:3000"
      JWT_ACCESS_SECRET: "dummy_access_secret_for_ci_testing"
      JWT_REFRESH_SECRET: "dummy_refresh_secret_for_ci_testing"